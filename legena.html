<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pasinaon Aksara Legena</title>
  </head>
  <body class="bg-[#E1F5FE] font-sans overflow-hidden flex h-[100dvh]">
    
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-[80] hidden"></div>
    <aside id="sidebar" class="sidebar-abstrak fixed lg:static inset-y-0 left-0 w-64 bg-[#B3E5FC] border-r-4 border-[#03A9F4] z-[90] transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col overflow-hidden">
        <a href="/index.html" class="hidden lg:block p-5 bg-[#03A9F4] text-[#FFFFFF] text-center font-serif transition-all duration-300 border-b-4 border-[#3E2723]">
          <span class="text-2xl font-bold block leading-tight">Pasinaon</span>
          <span class="text-sm font-medium tracking-widest opacity-90">ꦄꦏ꧀ꦱꦫ ꦗꦮ</span>
        </a>
        <nav class="flex-1 p-3 pt-20 lg:pt-4 space-y-2 overflow-y-auto text-[#3E2723] font-bold text-sm">
          <a href="pengenalan.html" class="block p-3 hover:bg-[#81D4FA] hover:text-[#01579B] rounded-xl transition border-b-2 border-transparent hover:border-[#03A9F4]">Pengenalan Aksara Jawa</a>
          
          <a href="legena.html" class="block p-3 bg-[#81D4FA] text-[#01579B] shadow-md border-l-4 border-[#03A9F4] rounded-xl transition">Aksara Legena</a>
          
          <a href="pasangan.html" class="block p-3 hover:bg-[#81D4FA] hover:text-[#01579B] rounded-xl transition border-b-2 border-transparent hover:border-[#03A9F4]">Pasangan Aksara Legena</a>
          <details class="group">
            <summary class="p-3 hover:bg-[#81D4FA] hover:text-[#01579B] rounded-xl cursor-pointer flex justify-between items-center transition">
              Sandhangan
              <span class="transition-transform duration-300 group-open:rotate-180 text-xs">▼</span>
            </summary>
            <div class="pl-6 pb-2 space-y-1 mt-1 text-xs font-semibold">
              <a href="#" class="block p-2 hover:text-[#01579B] hover:bg-[#81D4FA]/70 rounded-lg transition">Sandhangan Swara</a>
              <a href="#" class="block p-2 hover:text-[#01579B] hover:bg-[#81D4FA]/70 rounded-lg transition">Sandhangan Wyanjana</a>
              <a href="#" class="block p-2 hover:text-[#01579B] hover:bg-[#81D4FA]/70 rounded-lg transition">Sandhangan Panyigeg Wanda</a>
            </div>
          </details>
          <a href="beranda-pasinaon.html" class="block p-3 hover:bg-[#81D4FA] hover:text-[#01579B] rounded-xl transition border-b-2 border-transparent hover:border-[#03A9F4]">Latihan Pasinaon</a>
        </nav>
      </aside>

    <div class="flex-1 flex flex-col h-full overflow-y-auto overflow-x-hidden relative w-full">
        <header class="lg:hidden sticky top-0 bg-[#B3E5FC] text-[#3E2723] p-3 flex-none w-full shadow-md flex justify-between items-center z-[100] border-b-2 border-[#03A9F4]">
            <button id="hamburger" class="hamburger-abstrak px-3 py-1 bg-[#03A9F4] text-[#FFFFFF] shadow-sm text-xl font-bold leading-none border border-[#3E2723] hover:bg-sky-600 transition transform hover:scale-105">☰</button>
            <a href="/index.html" class="font-serif text-lg font-bold hover:scale-105 hover:text-[#03A9F4] transition-transform duration-300">Aksara Legena 📜</a>
          </header>

          <main id="main-scroll-area" class="flex-1 relative flex items-center justify-center w-full overflow-auto p-4 md:p-8 bg-[url('/assets/bg-pattern.png')] bg-cover">
            
            <!-- Tampilan Sampul Awal (Intro) -->
            <div id="legena-cover-intro" class="fixed inset-0 z-[999] flex items-center justify-center bg-[#795548] cursor-pointer transition-opacity duration-[1500ms]" onclick="openLegenaCover()">
              <div class="w-full h-full flex items-center justify-center" style="perspective: 2000px;">
                <!-- Wrapper Utama Buku -->
                <div id="legena-intro-book-wrapper" class="relative transition-all duration-[1200ms] ease-in-out h-[65vh] md:h-[75vh] max-h-[500px] aspect-[3/4] max-w-[85vw]" style="transform: rotateY(15deg) rotateX(10deg); transform-style: preserve-3d;">
                  
                  <!-- Cover Belakang & Kertas (1 Layer Tebal) -->
                  <div class="absolute inset-0 bg-[#FEFBF3] rounded-r-xl md:rounded-r-2xl border-y-4 border-r-4 border-l-[20px] border-[#03A9F4] flex items-center justify-center overflow-hidden" style="box-shadow: inset 5px 0 10px rgba(0,0,0,0.3), 10px 10px 0px #FEFBF3, 14px 14px 0px #03A9F4, 25px 25px 40px rgba(0,0,0,0.7); transform: translateZ(-2px);">
                    <div class="absolute inset-0 opacity-10 bg-batik"></div>
                    <img src="/assets/aksara-ha.png" class="absolute w-[80%] max-w-none opacity-20 blur-[1px]" />
                  </div>

                  <!-- Cover Depan (Yang bisa dibuka) -->
                  <div id="legena-intro-front-cover" class="absolute inset-0 transition-transform duration-[1200ms] ease-in-out origin-left" style="transform-style: preserve-3d; z-index: 10; transform: translateZ(2px);">
                    
                    <!-- Sisi Luar Cover Depan -->
                    <div class="absolute inset-0 bg-[#795548] bg-wood-css rounded-r-xl md:rounded-r-2xl border-l-[20px] border-[#5D4037] border-y-2 border-r-2 flex flex-col items-center justify-center shadow-[-5px_0_15px_rgba(0,0,0,0.5)]" style="backface-visibility: hidden; transform: rotateY(0deg) translateZ(1px); border: 2px solid #03A9F4;">
                      <div class="absolute left-0 top-0 bottom-0 w-3 bg-gradient-to-r from-white/30 to-transparent pointer-events-none"></div>
                      <div class="absolute inset-3 md:inset-5 border-2 md:border-4 border-[#FFC947]/50 rounded-lg pointer-events-none"></div>
                      
                      <div class="text-center z-10 p-4 md:p-6 bg-[#0288D1]/90 rounded-xl backdrop-blur-sm border-2 border-[#FFC947]/30 w-[85%] flex flex-col items-center justify-center shadow-xl">
                        <h1 class="text-[#FFC947] font-serif font-bold uppercase leading-snug" style="font-size: min(4.5vh, 32px); text-shadow: 2px 2px 4px rgba(0,0,0,0.9);">AKSARA<br/>LEGENA</h1>
                      </div>
                    </div>

                    <!-- Sisi Dalam Cover Depan (Bagian dalam sampul coklat) -->
                    <div class="absolute inset-0 bg-[#795548] bg-wood-css rounded-l-xl md:rounded-l-2xl border-y-2 border-l-2 border-r-[20px] border-[#5D4037] flex items-center justify-center overflow-hidden" style="backface-visibility: hidden; transform: rotateY(180deg) translateZ(1px); border: 2px solid #03A9F4;">
                    </div>
                  </div>

                </div>
              </div>
            </div>

            <div class="absolute inset-0 bg-black/70 backdrop-blur-sm z-0"></div>
            <div class="relative flex items-center justify-center mx-auto z-10 w-full" style="aspect-ratio: 8/5; height: 85vh; max-height: 550px; max-width: 95vw; perspective: 1500px;">
              
              <!-- LAPISAN 1: BUKU 3D -->
              <div class="book-container absolute inset-0 w-full h-full bg-wood-css p-2 md:p-4 rounded-sm book-3d-shadow flex flex-col pointer-events-none z-0">
                <div class="flex flex-row flex-1 book-content rounded-sm shadow-inner bg-[#FEFBF3] relative">
                  <div class="flex-1 w-1/2 border-r border-[#d7ccc8]/50"></div>
                  <div class="flex-1 w-1/2"></div>
                  
                  <!-- Binder Rings -->
                  <div class="absolute top-[5%] bottom-[5%] left-1/2 -translate-x-1/2 w-6 md:w-8 flex flex-col justify-evenly items-center z-10">
                    <!-- Ring 1 -->
                    <div class="relative w-full h-3 flex items-center justify-center">
                      <div class="absolute left-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                      <div class="absolute right-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                      <div class="w-[90%] h-1.5 md:h-2 bg-gradient-to-b from-[#e0e0e0] via-[#ffffff] to-[#757575] rounded-full border border-[#424242] shadow-[2px_3px_5px_rgba(0,0,0,0.5),_inset_0_-1px_2px_rgba(0,0,0,0.8)] relative overflow-hidden z-10">
                         <div class="absolute w-[30%] h-full bg-gradient-to-r from-transparent via-white to-transparent left-[15%]"></div>
                      </div>
                    </div>
                    <!-- Ring 2 -->
                    <div class="relative w-full h-3 flex items-center justify-center">
                      <div class="absolute left-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                      <div class="absolute right-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                      <div class="w-[90%] h-1.5 md:h-2 bg-gradient-to-b from-[#e0e0e0] via-[#ffffff] to-[#757575] rounded-full border border-[#424242] shadow-[2px_3px_5px_rgba(0,0,0,0.5),_inset_0_-1px_2px_rgba(0,0,0,0.8)] relative overflow-hidden z-10">
                         <div class="absolute w-[30%] h-full bg-gradient-to-r from-transparent via-white to-transparent left-[15%]"></div>
                      </div>
                    </div>
                    <!-- Ring 3 -->
                    <div class="relative w-full h-3 flex items-center justify-center">
                      <div class="absolute left-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                      <div class="absolute right-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                      <div class="w-[90%] h-1.5 md:h-2 bg-gradient-to-b from-[#e0e0e0] via-[#ffffff] to-[#757575] rounded-full border border-[#424242] shadow-[2px_3px_5px_rgba(0,0,0,0.5),_inset_0_-1px_2px_rgba(0,0,0,0.8)] relative overflow-hidden z-10">
                         <div class="absolute w-[30%] h-full bg-gradient-to-r from-transparent via-white to-transparent left-[15%]"></div>
                      </div>
                    </div>
                    <!-- Ring 4 -->
                    <div class="relative w-full h-3 flex items-center justify-center">
                      <div class="absolute left-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                      <div class="absolute right-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                      <div class="w-[90%] h-1.5 md:h-2 bg-gradient-to-b from-[#e0e0e0] via-[#ffffff] to-[#757575] rounded-full border border-[#424242] shadow-[2px_3px_5px_rgba(0,0,0,0.5),_inset_0_-1px_2px_rgba(0,0,0,0.8)] relative overflow-hidden z-10">
                         <div class="absolute w-[30%] h-full bg-gradient-to-r from-transparent via-white to-transparent left-[15%]"></div>
                      </div>
                    </div>
                    <!-- Ring 5 -->
                    <div class="relative w-full h-3 flex items-center justify-center">
                      <div class="absolute left-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                      <div class="absolute right-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                      <div class="w-[90%] h-1.5 md:h-2 bg-gradient-to-b from-[#e0e0e0] via-[#ffffff] to-[#757575] rounded-full border border-[#424242] shadow-[2px_3px_5px_rgba(0,0,0,0.5),_inset_0_-1px_2px_rgba(0,0,0,0.8)] relative overflow-hidden z-10">
                         <div class="absolute w-[30%] h-full bg-gradient-to-r from-transparent via-white to-transparent left-[15%]"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
      
              <!-- LAPISAN 2: KONTEN 2D OVERLAY -->
              <div id="book-layout" class="popup-overlay absolute top-[10%] md:top-[12%] w-full h-[65%] flex flex-row z-10 pointer-events-none">
              </div>
      
            </div>
          </main>
    </div>
    <div id="canvas-modal" class="fixed inset-0 z-[100] hidden overflow-y-auto bg-black/80 backdrop-blur-sm">
      <div id="canvas-modal-inner" style="display: flex; min-height: 100%; align-items: center; justify-content: center; padding: 2rem 1rem;">
        <div id="canvas-modal-card" class="bg-[#FEFBF3] relative border-4 border-[#03A9F4] flex flex-col items-center" style="margin: auto; padding: 1.25rem 1.5rem 1.25rem; border-radius: 1.5rem; width: fit-content; min-width: 280px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);">

          <!-- Baris atas: spasi | judul | tombol X -->
          <div style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:0.75rem; margin-bottom:1rem;">
            <div style="width:30px; flex-shrink:0;"></div>
            <div class="book-banner text-center" style="padding: 0.35rem 1.25rem; border-radius: 0.75rem; flex:1; min-width:0;">
              <h2 class="font-serif font-bold tracking-wide" style="font-size: 1rem; white-space: nowrap;">Latihan Nebali</h2>
            </div>
            <!-- Tombol X: jajar genjang via skewX, shadow seperti tombol lain -->
            <button onclick="closeCanvas()" class="btn-close-3d cursor-pointer" style="flex-shrink:0; width:30px; height:20px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:11px; color:#FFFFFF; background:linear-gradient(135deg,#03A9F4,#0288D1); transform:skewX(-14deg); box-shadow:0 3px 0 #0288D1, 0 4px 8px rgba(0,0,0,0.35); border:1px solid rgba(255,201,71,0.4); border-radius:2px;">
              <span style="transform:skewX(14deg); display:block;">✖</span>
            </button>
          </div>

          <!-- Panel aksara -->
          <div id="canvas-container" style="display: flex; flex-direction: row; flex-wrap: nowrap; justify-content: center; align-items: flex-start; gap: 1.5rem; margin-bottom: 1rem;"></div>

          <!-- Tombol aksi -->
          <div style="display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 0.75rem; width: 100%;">
            <button onclick="clearCanvas()" class="btn-modern-3d font-bold shadow-md cursor-pointer" style="flex: 1; min-width: 120px; padding: 0.65rem; border-radius: 0.75rem; font-size: 0.8rem; background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; border-bottom: 4px solid #7f1d1d; text-shadow: none;">↺ BALENI</button>
            <button onclick="checkCanvas()" class="btn-modern-3d font-bold shadow-md cursor-pointer" style="flex: 1; min-width: 120px; padding: 0.65rem; border-radius: 0.75rem; font-size: 0.8rem; background: linear-gradient(135deg, #22c55e, #15803d); color: white; border-bottom: 4px solid #14532d; text-shadow: none;">✅ CEK HASIL</button>
          </div>
        </div>
      </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/legena.js"></script>
  </body>
</html>
