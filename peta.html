<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8 candi di Mojokerto</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Javanese&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#E1F5FE] font-sans overflow-hidden flex h-[100dvh]">
    <div class="flex-1 flex flex-col h-full overflow-y-auto overflow-x-hidden relative w-full">
      <header class="bg-[#B3E5FC] text-[#3E2723] p-3 flex-none w-full shadow-md flex justify-between items-center z-[100] border-b-2 border-[#03A9F4]">
        <a
          href="/beranda.html"
          class="btn-home-header bg-[#03A9F4] hover:bg-sky-600 text-[#FFFFFF] font-bold px-3 py-1 md:px-4 md:py-2 rounded-lg shadow-lg border-2 border-[#FFC947] transition-transform hover:scale-105 active:scale-95 flex items-center justify-center"
          title="Pulang ke Beranda"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </a>
        <span class="font-serif text-lg font-bold">Latihan Pasinaon 🗺️</span>
        <div class="w-12"></div>
      </header>

      <main class="flex-1 bg-batik relative flex flex-col w-full">
        <!-- Tampilan Sampul Awal (Intro) -->
        <div id="map-cover-intro" class="fixed inset-0 z-[999] flex items-center justify-center bg-[#795548] cursor-pointer transition-opacity duration-[1500ms]" onclick="openIntroCover()">
          <div class="w-full h-full flex items-center justify-center" style="perspective: 2000px">
            <!-- Wrapper Utama Buku -->
            <div
              id="intro-book-wrapper"
              class="relative transition-all duration-[1200ms] ease-in-out h-[65vh] md:h-[75vh] max-h-[500px] aspect-[3/4] max-w-[85vw]"
              style="transform: rotateY(15deg) rotateX(10deg); transform-style: preserve-3d"
            >
              <!-- Cover Belakang & Kertas (1 Layer Tebal) -->
              <div
                class="absolute inset-0 bg-[#FEFBF3] rounded-r-xl md:rounded-r-2xl border-y-4 border-r-4 border-l-[20px] border-[#03A9F4] flex items-center justify-center overflow-hidden"
                style="
                  box-shadow:
                    inset 5px 0 10px rgba(0, 0, 0, 0.3),
                    10px 10px 0px #fefbf3,
                    14px 14px 0px #03a9f4,
                    25px 25px 40px rgba(0, 0, 0, 0.7);
                  transform: translateZ(-2px);
                "
              >
                <div class="absolute inset-0 opacity-10 bg-batik"></div>
                <!-- Peta blur di halaman kanan -->
                <img src="/assets/peta-candi-blank.png" class="absolute w-[150%] max-w-none opacity-40 blur-[2px]" />
              </div>

              <!-- Cover Depan (Yang bisa dibuka) -->
              <div id="intro-front-cover" class="absolute inset-0 transition-transform duration-[1200ms] ease-in-out origin-left" style="transform-style: preserve-3d; z-index: 10; transform: translateZ(2px)">
                <!-- Sisi Luar Cover Depan -->
                <div
                  class="absolute inset-0 bg-[#795548] bg-wood-css rounded-r-xl md:rounded-r-2xl border-l-[20px] border-[#5D4037] border-y-2 border-r-2 flex flex-col items-center justify-center shadow-[-5px_0_15px_rgba(0,0,0,0.5)]"
                  style="backface-visibility: hidden; transform: rotateY(0deg) translateZ(1px); border: 2px solid #03a9f4"
                >
                  <div class="absolute left-0 top-0 bottom-0 w-3 bg-gradient-to-r from-white/30 to-transparent pointer-events-none"></div>
                  <div class="absolute inset-3 md:inset-5 border-2 md:border-4 border-[#FFC947]/50 rounded-lg pointer-events-none"></div>

                  <div class="text-center z-10 p-4 md:p-6 bg-[#0288D1]/90 rounded-xl backdrop-blur-sm border-2 border-[#FFC947]/30 w-[85%] flex flex-col items-center justify-center shadow-xl">
                    <h1 class="text-[#FFC947] font-serif font-bold uppercase leading-snug" style="font-size: min(4.5vh, 32px); text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9)">PASINAON<br />AKSARA JAWA</h1>
                  </div>
                </div>

                <!-- Sisi Dalam Cover Depan (Bagian dalam sampul coklat) -->
                <div
                  class="absolute inset-0 bg-[#795548] bg-wood-css rounded-l-xl md:rounded-l-2xl border-y-2 border-l-2 border-r-[20px] border-[#5D4037] flex items-center justify-center overflow-hidden"
                  style="backface-visibility: hidden; transform: rotateY(180deg) translateZ(1px); border: 2px solid #03a9f4"
                ></div>
              </div>
            </div>
          </div>
        </div>
        <!-- Dora Map Overlay (Tampil setelah buku dibuka) -->
        <div id="dora-map-overlay" class="fixed inset-0 z-[1000] flex items-center justify-center bg-black/40 backdrop-blur-sm cursor-pointer hidden opacity-0 transition-opacity duration-500" onclick="closeDoraMap()">
          <div id="dora-map-content" class="relative transition-all duration-[800ms] ease-[cubic-bezier(0.34,1.56,0.64,1)] transform scale-0 translate-y-20 flex flex-col items-center">
            <img src="/assets/botolpeta.png" class="w-auto h-[60vh] md:h-[80vh] max-h-[450px] drop-shadow-[0_20px_50px_rgba(0,0,0,0.8)]" />
            <p class="text-[#03A9F4] font-black text-sm md:text-2xl uppercase tracking-[0.2em] animate-bounce mt-4 drop-shadow-[0_2px_4px_rgba(0,0,0,1)]" style="text-shadow: 0 0 10px rgba(3, 169, 244, 0.5)">Klik Peta kanggo Mulai</p>
          </div>
        </div>

        <div class="w-full overflow-x-auto p-4 lg:p-8 flex-1 flex justify-start lg:justify-center items-start">
          <div id="main-map-wrapper" class="map-wrapper animate-dive-in relative inline-block opacity-0 pointer-events-none transition-opacity duration-1000">
            <img src="/assets/peta-candi-blank.png" class="map-image" />

            <button data-id="brahu" onclick="openQuiz('brahu')" class="hotspot" style="left: 37.61%; top: 27.17%">
              <img src="/assets/candi-brahu.png" style="width: 100px" />
              <div class="hotspot-name">Candi Brahu<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦧꦿꦲꦸ</span></div>
            </button>
            <button data-id="bajang" onclick="openQuiz('bajang')" class="hotspot" style="left: 60.3%; top: 60.13%">
              <img src="/assets/candi-bajang.png" style="width: 105px" />
              <div class="hotspot-name">Candi Bajang Ratu<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦧꦗꦁꦫꦠꦸ</span></div>
            </button>
            <button data-id="gentong" onclick="openQuiz('gentong')" class="hotspot" style="left: 53.89%; top: 29.13%">
              <img src="/assets/candi-gentong.png" style="width: 70px" />
              <div class="hotspot-name">Candi Gentong<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦒꦼꦤ꧀ꦠꦺꦴꦁ</span></div>
            </button>
            <button data-id="tikus" onclick="openQuiz('tikus')" class="hotspot" style="left: 39.91%; top: 51.1%">
              <img src="/assets/candi-tikus.png" style="width: 65px" />
              <div class="hotspot-name">Candi Tikus<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦠꦶꦏꦸꦱ꧀</span></div>
            </button>
            <button data-id="minakjinggo" onclick="openQuiz('minakjinggo')" class="hotspot" style="left: 69.35%; top: 71.36%">
              <img src="/assets/candi-minakjinggo.png" style="width: 75px" />
              <div class="hotspot-name">Candi Minak Jinggo<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦩꦶꦤꦏ꧀ꦗꦶꦁꦒꦺꦴ</span></div>
            </button>
            <button data-id="wringinlawang" onclick="openQuiz('wringinlawang')" class="hotspot" style="left: 66.06%; top: 37.67%">
              <img src="/assets/candi-wringinlawang.png" style="width: 75px" />
              <div class="hotspot-name">Candi Wringin Lawang<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦮꦿꦶꦔꦶꦤ꧀ꦭꦮꦁ</span></div>
            </button>
            <button data-id="jedong" onclick="openQuiz('jedong')" class="hotspot" style="left: 28.39%; top: 62.57%">
              <img src="/assets/candi-jedong.png" style="width: 70px" />
              <div class="hotspot-name">Candi Jedong<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦗꦼꦢꦺꦴꦁ</span></div>
            </button>
            <button data-id="kedaton" onclick="openQuiz('kedaton')" class="hotspot" style="left: 44.84%; top: 69.41%">
              <img src="/assets/candi-kedaton.png" style="width: 65px" />
              <div class="hotspot-name">Candi Kedaton<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦏꦼꦢꦠꦺꦴꦤ꧀</span></div>
            </button>
          </div>
        </div>

        <!-- Actions Bar -->
        <div id="actions-bar" class="absolute bottom-5 right-5 left-5 md:left-auto flex gap-2 z-[150]">
          <button
            id="btn-cek-hasil"
            onclick="showFinalResultWithScore()"
            class="hidden bg-[#03A9F4] hover:bg-sky-600 text-[#FFFFFF] font-bold py-1 px-2 md:px-3 rounded-lg shadow-lg border border-[#3E2723] transition-transform hover:scale-105 active:scale-95 duration-150 font-serif text-xs md:text-sm"
          >
            ✅ Cek
          </button>
          <button
            onclick="showDetailScore()"
            class="bg-[#9C27B0] hover:bg-purple-700 text-[#FFFFFF] font-bold py-1 px-2 md:px-3 rounded-lg shadow-lg border border-[#3E2723] transition-transform hover:scale-105 active:scale-95 duration-150 font-serif text-xs md:text-sm"
          >
            📖 Pambiji
          </button>
          <button
            id="btn-baleni"
            onclick="restartGame()"
            class="hidden bg-red-600 hover:bg-red-700 text-[#FFFFFF] font-bold py-1 px-2 md:px-3 rounded-lg shadow-lg border border-[#3E2723] transition-transform hover:scale-105 active:scale-95 duration-150 font-serif text-xs md:text-sm"
          >
            ↺ Baleni
          </button>
        </div>
      </main>
    </div>

    <div id="popup-book" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-2 md:p-6 bg-black/70 backdrop-blur-sm">
      <!-- WRAPPER UTAMA (Fixed Aspect Ratio) -->
      <!-- Menggunakan aspect-ratio agar bentuk buku selalu konsisten proporsinya (tidak penyok) di HP maupun Web -->
      <div class="relative flex items-center justify-center mx-auto" style="aspect-ratio: 8/5; height: 85vh; max-height: 550px; max-width: 95vw; perspective: 1500px">
        <!-- LAPISAN 1: BUKU 3D (Lebih tidur: 65deg) -->
        <div class="book-container absolute inset-0 w-full h-full bg-wood-css p-2 md:p-4 rounded-sm book-3d-shadow flex flex-col pointer-events-none z-0">
          <div class="flex flex-row flex-1 book-content rounded-sm shadow-inner bg-[#FEFBF3] relative">
            <div class="flex-1 w-1/2 border-r border-[#d7ccc8]/50"></div>
            <div class="flex-1 w-1/2"></div>

            <!-- Binder Rings -->
            <div class="absolute top-[5%] bottom-[5%] left-1/2 -translate-x-1/2 w-6 md:w-8 flex flex-col justify-evenly items-center z-10">
              <!-- Ring 1 -->
              <div class="relative w-full h-3 flex items-center justify-center">
                <!-- Lubang Kertas -->
                <div class="absolute left-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                <div class="absolute right-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                <!-- Besi Ring -->
                <div
                  class="w-[90%] h-1.5 md:h-2 bg-gradient-to-b from-[#e0e0e0] via-[#ffffff] to-[#757575] rounded-full border border-[#424242] shadow-[2px_3px_5px_rgba(0,0,0,0.5),_inset_0_-1px_2px_rgba(0,0,0,0.8)] relative overflow-hidden z-10"
                >
                  <div class="absolute w-[30%] h-full bg-gradient-to-r from-transparent via-white to-transparent left-[15%]"></div>
                </div>
              </div>
              <!-- Ring 2 -->
              <div class="relative w-full h-3 flex items-center justify-center">
                <div class="absolute left-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                <div class="absolute right-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                <div
                  class="w-[90%] h-1.5 md:h-2 bg-gradient-to-b from-[#e0e0e0] via-[#ffffff] to-[#757575] rounded-full border border-[#424242] shadow-[2px_3px_5px_rgba(0,0,0,0.5),_inset_0_-1px_2px_rgba(0,0,0,0.8)] relative overflow-hidden z-10"
                >
                  <div class="absolute w-[30%] h-full bg-gradient-to-r from-transparent via-white to-transparent left-[15%]"></div>
                </div>
              </div>
              <!-- Ring 3 -->
              <div class="relative w-full h-3 flex items-center justify-center">
                <div class="absolute left-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                <div class="absolute right-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                <div
                  class="w-[90%] h-1.5 md:h-2 bg-gradient-to-b from-[#e0e0e0] via-[#ffffff] to-[#757575] rounded-full border border-[#424242] shadow-[2px_3px_5px_rgba(0,0,0,0.5),_inset_0_-1px_2px_rgba(0,0,0,0.8)] relative overflow-hidden z-10"
                >
                  <div class="absolute w-[30%] h-full bg-gradient-to-r from-transparent via-white to-transparent left-[15%]"></div>
                </div>
              </div>
              <!-- Ring 4 -->
              <div class="relative w-full h-3 flex items-center justify-center">
                <div class="absolute left-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                <div class="absolute right-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                <div
                  class="w-[90%] h-1.5 md:h-2 bg-gradient-to-b from-[#e0e0e0] via-[#ffffff] to-[#757575] rounded-full border border-[#424242] shadow-[2px_3px_5px_rgba(0,0,0,0.5),_inset_0_-1px_2px_rgba(0,0,0,0.8)] relative overflow-hidden z-10"
                >
                  <div class="absolute w-[30%] h-full bg-gradient-to-r from-transparent via-white to-transparent left-[15%]"></div>
                </div>
              </div>
              <!-- Ring 5 -->
              <div class="relative w-full h-3 flex items-center justify-center">
                <div class="absolute left-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                <div class="absolute right-[-2px] w-2 h-2 bg-[#795548]/90 rounded-full shadow-[inset_1px_1px_3px_rgba(0,0,0,0.9)]"></div>
                <div
                  class="w-[90%] h-1.5 md:h-2 bg-gradient-to-b from-[#e0e0e0] via-[#ffffff] to-[#757575] rounded-full border border-[#424242] shadow-[2px_3px_5px_rgba(0,0,0,0.5),_inset_0_-1px_2px_rgba(0,0,0,0.8)] relative overflow-hidden z-10"
                >
                  <div class="absolute w-[30%] h-full bg-gradient-to-r from-transparent via-white to-transparent left-[15%]"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- LAPISAN 2: KONTEN 2D OVERLAY (Tegak Lurus, Rapi, Terpisah dari Buku) -->
        <!-- Menambahkan top-[10%] md:top-[12%] agar konten tidak tumpah melewati garis bawah buku -->
        <div class="popup-overlay absolute top-[10%] md:top-[12%] w-full h-[65%] flex flex-row z-10 pointer-events-none">
          <a
            href="/beranda.html"
            class="btn-home-popup absolute -top-3 -left-3 md:-top-5 md:-left-5 bg-[#03A9F4] hover:bg-sky-600 text-[#FFFFFF] px-2 py-1 md:px-3 md:py-2 rounded-full font-bold border-2 border-[#FFC947] cursor-pointer z-[200] pointer-events-auto transition-transform hover:scale-110 active:scale-95 flex items-center justify-center"
            title="Pulang ke Beranda"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </a>
          <button
            onclick="closeQuiz()"
            class="btn-close-3d absolute -top-3 -right-3 md:-top-5 md:-right-5 bg-red-600 text-white px-3 py-1 md:px-4 md:py-2 rounded-full font-bold border-2 border-white cursor-pointer z-[200] pointer-events-auto"
          >
            ✖
          </button>

          <div class="page-left flex-1 w-1/2 p-2 pl-2 pr-10 md:p-6 md:pl-6 md:pr-20 flex flex-col items-center justify-center gap-2 md:gap-4 relative pointer-events-auto">
            <div class="animate-duarr-1 relative w-full flex justify-center flex-shrink-0 z-[50] -mt-4 md:-mt-8">
              <div class="landscape-bg absolute bottom-0 w-3/4 h-20 opacity-60 rounded-full blur-md"></div>
              <img id="book-img" src="" class="h-28 md:h-52 object-contain drop-shadow-2xl transition-transform hover:scale-110" />
            </div>

            <div onclick="showDetailDesc()" class="animate-duarr-2 bg-[#FEFBF3]/90 p-2 md:p-3 rounded-lg border border-[#03A9F4]/20 floating-item w-[90%] md:w-[85%] mx-auto flex-none -mt-1 md:-mt-2 cursor-pointer hover:bg-[#E1F5FE] transition-colors" title="Pencet kanggo waca selengkape">
              <p id="book-desc" class="text-[8px] md:text-sm text-justify text-[#795548] leading-relaxed m-0 font-medium font-serif"></p>
              <p class="text-[6px] md:text-[10px] text-[#03A9F4] font-bold text-center mt-1 mb-0 italic">Pencet kanggo waca selengkape</p>
            </div>

            <div class="animate-duarr-3 stone-plaque w-[80%] md:w-full max-w-[90%] px-2 py-1 md:px-3 md:py-2 z-20 flex-shrink-0 mt-1 md:mt-2 relative">
              <p id="book-lokasi" class="text-[7px] md:text-[11px] font-bold uppercase tracking-widest text-center m-0 leading-none"></p>
            </div>
          </div>

          <div class="page-right flex-1 w-1/2 p-2 pr-2 pl-10 md:p-6 md:pr-6 md:pl-20 flex flex-col justify-center gap-2 md:gap-4 relative pointer-events-auto">
            <div class="animate-duarr-1 book-banner w-[80%] md:w-[70%] mx-auto py-1 md:py-1.5 text-center flex-shrink-0 z-10 mt-1 md:mt-2">
              <h3 class="font-serif text-[10px] md:text-lg font-bold leading-none">Latihan Pasinaon</h3>
            </div>

            <div class="animate-duarr-2 floating-item flex flex-col justify-center gap-2 md:gap-4 w-[90%] md:w-[85%] mx-auto relative z-10 p-2 md:p-4 rounded-xl border border-[#795548]/10 bg-white/90 flex-shrink-0">
              <p class="text-[7px] md:text-xs text-center italic text-[#5D4037] font-serif m-0 font-medium">"Isenana ukara ing ngisor iki nganggo wangsulan sing bener!"</p>

              <div class="space-y-2 md:space-y-4 pr-1">
                <div>
                  <label id="q1-text" class="block text-[8px] md:text-sm font-bold mb-1 md:mb-1.5 text-[#795548] font-serif"></label>
                  <div class="relative flex items-center">
                    <input
                      id="ans1"
                      type="text"
                      class="quiz-input w-full p-1 md:p-2 pr-12 md:pr-24 rounded-md border-2 border-[#5d4037]/30 bg-white font-serif text-[8px] md:text-sm focus:outline-none focus:border-[#5c7a52]"
                      placeholder="Ketik wangsulan..."
                    />
                    <div id="feedback1" class="feedback-bubble text-[7px] md:text-[11px] right-1 md:right-2"></div>
                  </div>
                </div>
                <div>
                  <label id="q2-text" class="block text-[8px] md:text-sm font-bold mb-1 md:mb-1.5 text-[#795548] font-serif"></label>
                  <div class="relative flex items-center">
                    <input
                      id="ans2"
                      type="text"
                      class="quiz-input w-full p-1 md:p-2 pr-12 md:pr-24 rounded-md border-2 border-[#5d4037]/30 bg-white font-serif text-[8px] md:text-sm focus:outline-none focus:border-[#5c7a52]"
                      placeholder="Ketik wangsulan..."
                    />
                    <div id="feedback2" class="feedback-bubble text-[7px] md:text-[11px] right-1 md:right-2"></div>
                  </div>
                </div>
              </div>
            </div>

            <button
              onclick="checkAllAnswers()"
              class="animate-duarr-3 btn-modern-3d w-[80%] md:w-[70%] mx-auto py-1.5 md:py-2.5 text-[9px] md:text-sm font-serif z-10 flex-shrink-0 pointer-events-auto mt-3 md:mt-6 mb-1 md:mb-2 uppercase font-bold tracking-wider active:scale-95 transition-transform duration-150"
            >
              PRIKSA WANGSULAN
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/peta/peta.js"></script>
  </body>
</html>
