<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8 candi di Mojokerto</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Javanese&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#FFF3E0] font-sans overflow-hidden flex h-[100dvh]">
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-[80] hidden"></div>

    <aside
      id="sidebar"
      class="sidebar-abstrak fixed lg:static inset-y-0 left-0 w-64 bg-[#F5E6CA] border-r-4 border-[#3E2723] z-[90] transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col overflow-hidden"
    >
      <a href="/index.html" class="hidden lg:block p-5 bg-[#3E2723] text-[#FFB300] text-center font-serif transition-all duration-300 border-b-4 border-[#3E2723]">
        <span class="text-2xl font-bold block leading-tight">Pasinaon</span>
        <span class="text-sm font-medium tracking-widest opacity-90">ꦄꦏ꧀ꦱꦫ ꦗꦮ</span>
      </a>
      <nav class="flex-1 p-3 pt-20 lg:pt-4 space-y-2 overflow-y-auto text-[#5D4037] font-bold text-sm">
        <a href="pengenalan.html" class="block p-3 hover:bg-[#D7CCC8] rounded-xl transition">Pengenalan Aksara Jawa</a>
        <a href="legena.html" class="block p-3 hover:bg-[#D7CCC8] rounded-xl transition">Aksara Legena</a>
        <a href="pasangan.html" class="block p-3 hover:bg-[#D7CCC8] rounded-xl transition">Pasangan Aksara Legena</a>
        <details class="group">
          <summary class="p-3 hover:bg-[#D7CCC8] rounded-xl cursor-pointer flex justify-between items-center transition">
            Sandhangan
            <span class="transition-transform duration-300 group-open:rotate-180 text-xs">▼</span>
          </summary>
          <div class="pl-6 pb-2 space-y-1 mt-1 text-xs font-semibold">
            <a href="#" class="block p-2 hover:text-[#3E2723] hover:bg-[#D7CCC8]/70 rounded-lg transition">Sandhangan Swara</a>
            <a href="#" class="block p-2 hover:text-[#3E2723] hover:bg-[#D7CCC8]/70 rounded-lg transition">Sandhangan Wyanjana</a>
            <a href="#" class="block p-2 hover:text-[#3E2723] hover:bg-[#D7CCC8]/70 rounded-lg transition">Sandhangan Panyigeg Wanda</a>
          </div>
        </details>

        <a href="beranda-pasinaon.html" class="block p-3 bg-[#FFB300] text-[#3E2723] shadow-md rounded-xl transition">Latihan Pasinaon</a>
      </nav>
    </aside>

    <div class="flex-1 flex flex-col h-full overflow-y-auto overflow-x-hidden relative w-full">
      <header class="lg:hidden bg-[#3E2723] text-white p-3 flex-none w-full shadow-md flex justify-between items-center z-[100]">
        <button id="hamburger" class="hamburger-abstrak px-3 py-1 bg-[#FFB300] text-[#3E2723] shadow-sm text-xl font-bold leading-none hover:bg-yellow-400 transition transform hover:scale-105">☰</button>
        <a href="/index.html" class="font-serif text-lg font-bold hover:scale-105 hover:text-[#FFB300] transition-transform duration-300">Latihan Pasinaon 🗺️</a>
      </header>

      <main class="flex-1 bg-batik relative flex flex-col w-full">
        <div class="w-full overflow-x-auto p-4 lg:p-8 flex-1 flex justify-start lg:justify-center items-start">
          <div class="map-wrapper animate-dive-in relative inline-block">
            <img src="/assets/peta-candi-blank.png" class="map-image" />

            <button data-id="brahu" onclick="openQuiz('brahu')" class="hotspot" style="left: 37.61%; top: 27.17%">
              <img src="/assets/candi-brahu.png" style="width: 100px" />
              <div class="hotspot-name">Candi Brahu<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦧꦿꦲꦸ</span></div>
            </button>
            <button data-id="bajang" onclick="openQuiz('bajang')" class="hotspot" style="left: 60.3%; top: 60.13%">
              <img src="/assets/candi-bajang.png" style="width: 105px" />
              <div class="hotspot-name">Candi Bajang Ratu<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦧꦗꦁꦫꦠꦸ</span></div>
            </button>
            <button data-id="gentong" onclick="openQuiz('gentong')" class="hotspot" style="left: 53.89%; top: 29.13%">
              <img src="/assets/candi-gentong.png" style="width: 70px" />
              <div class="hotspot-name">Candi Gentong<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦒꦼꦤ꧀ꦠꦺꦴꦁ</span></div>
            </button>
            <button data-id="tikus" onclick="openQuiz('tikus')" class="hotspot" style="left: 39.91%; top: 51.1%">
              <img src="/assets/candi-tikus.png" style="width: 65px" />
              <div class="hotspot-name">Candi Tikus<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦠꦶꦏꦸꦱ꧀</span></div>
            </button>
            <button data-id="minakjinggo" onclick="openQuiz('minakjinggo')" class="hotspot" style="left: 69.35%; top: 71.36%">
              <img src="/assets/candi-minakjinggo.png" style="width: 75px" />
              <div class="hotspot-name">Candi Minak Jinggo<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦩꦶꦤꦏ꧀ꦗꦶꦁꦒꦺꦴ</span></div>
            </button>
            <button data-id="wringinlawang" onclick="openQuiz('wringinlawang')" class="hotspot" style="left: 66.06%; top: 37.67%">
              <img src="/assets/candi-wringinlawang.png" style="width: 75px" />
              <div class="hotspot-name">Candi Wringin Lawang<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦮꦿꦶꦔꦶꦤ꧀ꦭꦮꦁ</span></div>
            </button>
            <button data-id="jedong" onclick="openQuiz('jedong')" class="hotspot" style="left: 28.39%; top: 62.57%">
              <img src="/assets/candi-jedong.png" style="width: 70px" />
              <div class="hotspot-name">Candi Jedong<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦗꦼꦢꦺꦴꦁ</span></div>
            </button>
            <button data-id="kedaton" onclick="openQuiz('kedaton')" class="hotspot" style="left: 44.84%; top: 69.41%">
              <img src="/assets/candi-kedaton.png" style="width: 65px" />
              <div class="hotspot-name">Candi Kedaton<span class="font-jawa">ꦕꦤ꧀ꦢꦶ ꦏꦼꦢꦠꦺꦴꦤ꧀</span></div>
            </button>
          </div>
        </div>
      </main>
    </div>

    <div id="popup-book" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-0 md:p-6 bg-black/70 backdrop-blur-sm">
      
      <!-- WRAPPER UTAMA (Perspective diletakkan di sini agar anak langsung mendapat efek 3D) -->
      <div class="relative w-full max-w-5xl h-[85vh] lg:h-[550px] flex items-center justify-center" style="perspective: 1500px;">
        
        <!-- LAPISAN 1: BUKU 3D (Lebih tidur: 65deg) -->
        <div class="book-container absolute inset-0 w-full h-full bg-wood-css p-2 md:p-4 rounded-sm book-3d-shadow flex flex-col pointer-events-none z-0">
          <div class="flex flex-row flex-1 book-content rounded-sm shadow-inner bg-[#fdf5e6]">
            <div class="flex-1 w-1/2 border-r border-[#d7ccc8]/50"></div>
            <div class="flex-1 w-1/2"></div>
          </div>
        </div>

        <!-- LAPISAN 2: KONTEN 2D OVERLAY (Tegak Lurus, Rapi, Terpisah dari Buku) -->
        <div class="popup-overlay absolute w-full h-[65%] flex flex-row z-10 pointer-events-none">
          <button onclick="closeQuiz()" class="btn-close-3d absolute -top-3 -right-3 md:-top-5 md:-right-5 bg-red-800 text-[#FFB300] px-3 py-1 md:px-4 md:py-2 rounded-full font-bold border-2 border-[#FFB300] cursor-pointer z-[200] pointer-events-auto">
            ✖
          </button>

          <div class="page-left flex-1 w-1/2 p-2 md:p-6 flex flex-col items-center justify-center gap-2 md:gap-4 relative pointer-events-auto">
            <div class="animate-duarr-1 relative w-full flex justify-center flex-shrink-0 z-[50] -mt-4 md:-mt-8">
              <div class="landscape-bg absolute bottom-0 w-3/4 h-20 opacity-60 rounded-full blur-md"></div>
              <img id="book-img" src="" class="h-28 md:h-52 object-contain drop-shadow-2xl transition-transform hover:scale-110" />
            </div>

            <div class="animate-duarr-2 bg-[#fdf5e6]/90 p-2 md:p-3 rounded-lg border border-[#3E2723]/20 floating-item w-[95%] md:w-[90%] mx-auto flex-none -mt-1 md:-mt-2">
              <p id="book-desc" class="text-[8px] md:text-sm text-justify text-[#3E2723] leading-relaxed m-0 font-medium font-serif"></p>
            </div>

            <div class="animate-duarr-3 stone-plaque w-[80%] md:w-full max-w-[90%] px-2 py-1 md:px-3 md:py-2 z-20 flex-shrink-0 mt-1 md:mt-2 relative">
              <p id="book-lokasi" class="text-[7px] md:text-[11px] font-bold uppercase tracking-widest text-center m-0 leading-none"></p>
            </div>
          </div>

          <div class="page-right flex-1 w-1/2 p-2 md:p-6 flex flex-col justify-center gap-2 md:gap-4 relative pointer-events-auto">
            <div class="animate-duarr-1 book-banner w-[80%] md:w-[70%] mx-auto py-1 md:py-1.5 text-center flex-shrink-0 z-10 mt-1 md:mt-2">
              <h3 class="font-serif text-[10px] md:text-lg font-bold leading-none">Latihan Pasinaon</h3>
            </div>

            <div class="animate-duarr-2 floating-item flex flex-col justify-center gap-2 md:gap-4 w-[95%] md:w-[90%] mx-auto relative z-10 p-2 md:p-4 rounded-xl border border-[#3E2723]/10 bg-white/40 flex-shrink-0">
              <p class="text-[7px] md:text-xs text-center italic text-[#5D4037] font-serif m-0">"Isenana ukara ing ngisor iki nganggo wangsulan sing bener!"</p>

              <div class="space-y-2 md:space-y-4 pr-1">
                <div>
                  <label id="q1-text" class="block text-[8px] md:text-sm font-bold mb-1 md:mb-1.5 text-[#3E2723] font-serif"></label>
                  <div class="relative flex items-center">
                    <input id="ans1" type="text" class="quiz-input w-full p-1 md:p-2 pr-12 md:pr-24 rounded-md border-2 border-[#5d4037]/30 bg-white font-serif text-[8px] md:text-sm focus:outline-none focus:border-[#5c7a52]" placeholder="Ketik wangsulan..." />
                    <div id="feedback1" class="feedback-bubble text-[7px] md:text-[11px] right-1 md:right-2"></div>
                  </div>
                </div>
                <div>
                  <label id="q2-text" class="block text-[8px] md:text-sm font-bold mb-1 md:mb-1.5 text-[#3E2723] font-serif"></label>
                  <div class="relative flex items-center">
                    <input id="ans2" type="text" class="quiz-input w-full p-1 md:p-2 pr-12 md:pr-24 rounded-md border-2 border-[#5d4037]/30 bg-white font-serif text-[8px] md:text-sm focus:outline-none focus:border-[#5c7a52]" placeholder="Ketik wangsulan..." />
                    <div id="feedback2" class="feedback-bubble text-[7px] md:text-[11px] right-1 md:right-2"></div>
                  </div>
                </div>
              </div>
            </div>

            <button onclick="checkAllAnswers()" class="animate-duarr-3 btn-modern-3d w-[80%] md:w-[70%] mx-auto py-1.5 md:py-2.5 text-[9px] md:text-sm font-serif z-10 flex-shrink-0 pointer-events-auto mt-3 md:mt-6 mb-1 md:mb-2">Priksa Wangsulan ✅</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/peta.js"></script>
  </body>
</html>
