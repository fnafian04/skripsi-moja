<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8 candi di Mojokerto</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Javanese&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#FFF3E0] font-sans overflow-hidden flex flex-col h-[100dvh]">
    <header class="lg:hidden bg-[#3E2723] text-white p-3 flex-none relative z-[70] shadow-md flex justify-between items-center">
      <button id="hamburger" class="px-3 py-1 bg-[#FFB300] text-[#3E2723] rounded-md shadow-sm text-xl font-bold leading-none hover:bg-yellow-400 transition">☰</button>
      <a href="/index.html" class="font-serif text-lg hover:scale-105 hover:text-[#FFB300] transition-transform duration-300">Pasinaon📜</a>
    </header>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-[55] hidden"></div>

    <div class="flex flex-1 overflow-hidden relative">
      <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 w-64 bg-[#F5E6CA] border-r-8 border-[#3E2723] z-[60] transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
        <a href="/index.html" class="block p-5 bg-[#3E2723] text-[#FFB300] text-center font-serif text-2xl transition-all duration-300 border-b-4 border-[#3E2723]">Caraka</a>
        <nav class="flex-1 p-3 space-y-2 overflow-y-auto text-[#5D4037] font-semibold text-sm">
          <p class="p-2 text-[10px] uppercase opacity-50 tracking-widest">Utama</p>
          <a href="#" class="block p-2.5 hover:bg-[#D7CCC8] rounded-xl">1. Pengenalan Aksara Jawa</a>
          <a href="legena.html" class="block p-2.5 hover:bg-[#D7CCC8] rounded-xl">2. Aksara Legena (Menebali)</a>
          <a href="#" class="block p-2.5 hover:bg-[#D7CCC8] rounded-xl">3. Pasangan Aksara (Menebali)</a>
          <p class="p-2 text-[10px] uppercase opacity-50 tracking-widest">Lanjut</p>
          <button class="w-full text-left p-2.5 hover:bg-[#D7CCC8] rounded-xl">4. Sandhangan</button>
          <a href="peta.html" class="block p-3 bg-[#FFB300] text-[#3E2723] rounded-xl shadow-md mt-4 text-center font-bold">5. Latihan Pasinaon ⚔️</a>
        </nav>
      </aside>

      <main class="flex-1 bg-batik relative overflow-hidden flex flex-col">
        <div class="map-container-scroll flex-1 p-4 lg:p-8">
          <div class="map-wrapper animate-dive-in">
            <img src="/assets/peta-candi-blank.png" class="map-image" />

            <button data-id="brahu" onclick="openQuiz('brahu')" class="hotspot" style="left: 37.88%; top: 25.79%">
              <img src="/assets/candi-brahu.png" style="width: 100px" />
              <div class="hotspot-name">Candi Brahu<span class="font-jawa">ꦕꦤ꧀ꦓꦶꦧꦿꦲꦸ</span></div>
            </button>
            <button data-id="bajang" onclick="openQuiz('bajang')" class="hotspot" style="left: 60.35%; top: 57.52%">
              <img src="/assets/candi-bajang.png" style="width: 105px" />
              <div class="hotspot-name">Candi Bajang Ratu<span class="font-jawa">ꦕꦤ꧀ꦓꦶꦧꦗꦁ</span></div>
            </button>
            <button data-id="gentong" onclick="openQuiz('gentong')" class="hotspot" style="left: 55.5%; top: 26.53%">
              <img src="/assets/candi-gentong.png" style="width: 70px" />
              <div class="hotspot-name">Candi Gentong<span class="font-jawa">ꦕꦤ꧀ꦓꦶꦒꦼꦤ꧀ꦠꦺꦴꦁ</span></div>
            </button>
            <button data-id="tikus" onclick="openQuiz('tikus')" class="hotspot" style="left: 40.75%; top: 48.61%">
              <img src="/assets/candi-tikus.png" style="width: 65px" />
              <div class="hotspot-name">Candi Tikus<span class="font-jawa">ꦕꦤ꧀ꦓꦶꦠꦶꦏꦸꦱ꧀</span></div>
            </button>
            <button data-id="minakjinggo" onclick="openQuiz('minakjinggo')" class="hotspot" style="left: 71.5%; top: 69.39%">
              <img src="/assets/candi-minakjinggo.png" style="width: 75px" />
              <div class="hotspot-name">Candi Minak Jinggo<span class="font-jawa">ꦩꦶꦤꦏ꧀ꦗꦶꦁꦒꦺꦴ</span></div>
            </button>
            <button data-id="wringinlawang" onclick="openQuiz('wringinlawang')" class="hotspot" style="left: 69%; top: 34.88%">
              <img src="/assets/candi-wringinlawang.png" style="width: 75px" />
              <div class="hotspot-name">Candi Wringin Lawang<span class="font-jawa">ꦮꦿꦶꦔꦶꦤ꧀ꦭꦮꦁ</span></div>
            </button>
            <button data-id="jedong" onclick="openQuiz('jedong')" class="hotspot" style="left: 29.38%; top: 60.22%">
              <img src="/assets/candi-jedong.png" style="width: 70px" />
              <div class="hotspot-name">Candi Jedong<span class="font-jawa">ꦕꦤ꧀ꦓꦶꦗꦼꦢꦺꦴꦁ</span></div>
            </button>
            <button data-id="kedaton" onclick="openQuiz('kedaton')" class="hotspot" style="left: 47.17%; top: 67.06%">
              <img src="/assets/candi-kedaton.png" style="width: 65px" />
              <div class="hotspot-name">Candi Kedaton<span class="font-jawa">ꦕꦤ꧀ꦓꦶꦏꦼꦢꦠꦺꦴꦤ꧀</span></div>
            </button>
          </div>
        </div>
      </main>
    </div>

    <div id="popup-book" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-2 md:p-8 bg-black/70 backdrop-blur-sm">
    <div class="book-container w-full max-w-5xl bg-wood-css p-2 md:p-5 rounded-xl md:rounded-2xl book-3d-shadow relative">
      <button onclick="closeQuiz()" class="absolute -top-3 -right-3 md:-top-5 md:-right-5 bg-red-800 text-[#FFB300] px-3 py-1 md:px-4 md:py-2 rounded-full z-[110] shadow-lg font-bold border-2 border-[#FFB300]">✖</button>
      
      <div class="flex flex-row h-[75vh] md:h-[450px] book-content rounded-xl overflow-hidden shadow-inner bg-[#fdf5e6]">
        
        <div class="flex-1 w-1/2 book-page p-3 md:p-5 flex flex-col items-center border-r-2 border-[#3E2723]/10 overflow-y-auto relative">
          
          <div class="book-banner w-11/12 py-1 md:py-2 text-center rounded-sm mb-3 z-10">
            <h2 id="book-title" class="text-xs md:text-2xl font-serif font-bold tracking-wide"></h2>
          </div>
          
          <p id="book-desc" class="text-[9px] md:text-[13px] text-justify text-[#3E2723] leading-relaxed mb-4 px-2 font-medium font-serif"></p>
          
          <div class="relative w-full flex-1 flex flex-col items-center justify-end mt-auto pb-4 md:pb-6">
            <div class="landscape-bg absolute bottom-4 md:bottom-6 w-3/4 h-24 md:h-40 mx-auto opacity-80"></div>
            <img id="book-img" src="" class="h-20 md:h-36 object-contain relative z-10 drop-shadow-[0_10px_10px_rgba(0,0,0,0.6)] hover:scale-105 transition-transform duration-500" />
            
            <div class="stone-plaque px-3 py-1 md:px-5 md:py-1.5 mt-2 absolute -bottom-1 md:-bottom-2 z-20">
              <p id="book-lokasi" class="text-[7px] md:text-[10px] font-bold uppercase tracking-widest text-center m-0 leading-none"></p>
            </div>
          </div>
        </div>

        <div class="flex-1 w-1/2 book-page p-3 md:p-5 flex flex-col bg-[#fdf5e6]/50 overflow-y-auto">
          
          <div class="book-banner w-3/4 mx-auto py-1 md:py-1.5 text-center rounded-full mb-2 md:mb-3 shadow-md flex-none">
            <h3 class="font-serif text-[10px] md:text-lg font-bold">Latihan Soal</h3>
          </div>
          
          <p class="text-[8px] md:text-xs text-center italic text-[#5D4037] mb-2 md:mb-4 font-serif flex-none px-2">
            "Isilah kalimat berikut dengan jawaban yang benar!"
          </p>
          
          <div class="space-y-3 pr-1 pb-1 flex-none">
            <div>
              <label id="q1-text" class="block text-[9px] md:text-[13px] font-bold mb-1 text-[#3E2723] font-serif"></label>
              <div class="relative flex items-center">
                <input id="ans1" type="text" class="quiz-input w-full p-1.5 md:p-3 pr-14 md:pr-24 rounded-lg border-2 border-[#5d4037]/30 transition-all outline-none text-[10px] md:text-sm bg-white focus:border-[#5c7a52] font-serif" placeholder="Ketik jawaban...">
                <div id="feedback1" class="feedback-bubble text-[8px] md:text-[11px] right-1 md:right-2"></div>
              </div>
            </div>
            
            <div>
              <label id="q2-text" class="block text-[9px] md:text-[13px] font-bold mb-1 text-[#3E2723] font-serif"></label>
              <div class="relative flex items-center">
                <input id="ans2" type="text" class="quiz-input w-full p-1.5 md:p-3 pr-14 md:pr-24 rounded-lg border-2 border-[#5d4037]/30 transition-all outline-none text-[10px] md:text-sm bg-white focus:border-[#5c7a52] font-serif" placeholder="Ketik jawaban...">
                <div id="feedback2" class="feedback-bubble text-[8px] md:text-[11px] right-1 md:right-2"></div>
              </div>
            </div>
          </div>
          
          <div class="pt-3 mt-auto flex-none">
            <button onclick="checkAllAnswers()" class="btn-modern-3d w-full py-2 md:py-3 text-[10px] md:text-sm font-serif">
              Cek Jawaban ✅
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
