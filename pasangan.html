<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pasangan Aksara Legena</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#E1F5FE] font-sans overflow-hidden flex h-[100dvh]">
    <div class="flex-1 flex flex-col h-full overflow-y-auto overflow-x-hidden relative w-full">
      <header class="bg-[#B3E5FC] text-[#3E2723] p-3 flex-none w-full shadow-md flex justify-between items-center z-[100] border-b-2 border-[#03A9F4]">
        <a
          href="/beranda.html"
          class="btn-home-header bg-[#03A9F4] hover:bg-sky-600 text-[#FFFFFF] font-bold px-3 py-1 md:px-4 md:py-2 rounded-lg shadow-lg border-2 border-[#FFC947] transition-transform hover:scale-105 active:scale-95 flex items-center justify-center"
          title="Pulang ke Beranda"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </a>
        <span class="font-serif text-lg font-bold">Pasangan Legena 📜</span>
        <div style="width: 40px"></div>
      </header>

      <main id="main-scroll-area" class="flex-1 bg-batik relative block w-full">
        <div style="display: flex; min-height: 100%; min-width: 100%; width: max-content; padding: 2rem 1.5rem; align-items: center; justify-content: center; margin: 0 auto; perspective: 1000px">
          <div class="book-container w-full max-w-4xl p-2 md:p-3 relative flex flex-col h-[80vh] lg:h-[480px] flex-shrink-0" style="min-width: 680px">
            <div id="book-layout" class="book-content flex flex-row flex-1 overflow-hidden bg-[#FEFBF3]"></div>
          </div>
        </div>
      </main>
    </div>

    <div id="canvas-modal" class="fixed inset-0 z-[100] hidden overflow-y-auto bg-black/80 backdrop-blur-sm">
      <div id="canvas-modal-inner" style="display: flex; min-height: 100%; align-items: center; justify-content: center; padding: 2rem 1rem">
        <div
          id="canvas-modal-card"
          class="bg-[#FEFBF3] relative border-4 border-[#03A9F4] flex flex-row items-stretch"
          style="margin: auto; padding: 1rem; border-radius: 1.5rem; width: 95%; max-width: 900px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); gap: 1rem;"
        >
          <!-- Tombol Home Absolute di Kiri Atas -->
          <a
            href="/beranda.html"
            class="btn-home-popup absolute cursor-pointer hover:scale-110 transition-transform"
            style="
              top: -20px; left: -20px;
              width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;
              background: #03a9f4; border: 2px solid #ffc947; border-radius: 50%; color: white;
              box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 50;
            "
            title="Pulang ke Beranda"
          >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </a>

          <!-- Tombol Silang (X) Absolute di Kanan Atas -->
          <button
            onclick="closeCanvas()"
            class="btn-close-3d cursor-pointer absolute hover:scale-110 transition-transform"
            style="
              top: -20px; right: -20px;
              width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;
              font-weight: 900; font-size: 20px; color: #ffffff; background: #dc2626;
              border: 2px solid #ffffff; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.4); z-index: 50;
            "
          >
            ✖
          </button>

          <!-- KIRI: Canvas Area -->
          <div class="flex-1 flex items-center justify-center bg-white rounded-xl border-2 border-dashed border-[#03A9F4] p-2 md:p-4">
            <div id="canvas-container" style="display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 1.5rem; width: 100%; height: 100%;"></div>
          </div>

          <!-- KANAN: Sidebar Kontrol -->
          <div class="flex flex-col w-[120px] sm:w-[150px] md:w-[220px] shrink-0 justify-center gap-2 md:gap-4">
            
            <!-- Atas: Judul -->
            <div class="flex flex-col items-center gap-2 md:gap-3">
              <div class="book-banner text-center w-full" style="padding: 0.5rem; border-radius: 0.75rem;">
                <h2 class="font-serif font-bold tracking-wide text-[14px] md:text-[1.1rem] leading-tight">Latihan Nebali Pasangan</h2>
              </div>
            </div>

            <!-- Tengah: Tombol Aksi -->
            <div class="flex flex-col gap-2 md:gap-3 justify-center mt-1 mb-1">
              <button
                onclick="clearCanvas()"
                class="btn-modern-3d font-bold shadow-md cursor-pointer active:scale-95 transition-transform duration-150 w-full text-[12px] md:text-[0.95rem] py-2 md:py-3"
                style="border-radius: 0.75rem; background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; border-bottom: 4px solid #7f1d1d; text-shadow: none;"
              >
                ↺ BALENI
              </button>
              <button
                onclick="checkCanvas()"
                class="btn-modern-3d font-bold shadow-md cursor-pointer active:scale-95 transition-transform duration-150 w-full text-[12px] md:text-[0.95rem] py-2 md:py-3"
                style="border-radius: 0.75rem; background: linear-gradient(135deg, #22c55e, #15803d); color: white; border-bottom: 4px solid #14532d; text-shadow: none;"
              >
                ✅ CEK HASIL
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/pasangan/pasangan.js"></script>
  </body>
</html>
