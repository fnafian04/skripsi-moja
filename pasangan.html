<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pasangan Aksara Legena</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#E1F5FE] font-sans overflow-hidden flex h-[100dvh]">
    <div class="flex-1 flex flex-col h-full overflow-y-auto overflow-x-hidden relative w-full">
      <header class="bg-[#B3E5FC] text-[#3E2723] p-3 flex-none w-full shadow-md flex justify-between items-center z-[100] border-b-2 border-[#03A9F4]">
        <a
          href="/beranda.html"
          class="btn-home-header bg-[#03A9F4] hover:bg-sky-600 text-[#FFFFFF] font-bold px-3 py-1 md:px-4 md:py-2 rounded-lg shadow-lg border-2 border-[#FFC947] transition-transform hover:scale-105 active:scale-95 flex items-center justify-center"
          title="Pulang ke Beranda"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </a>
        <span class="font-serif text-lg font-bold">Pasangan Legena 📜</span>
        <div style="width: 40px"></div>
      </header>

      <main id="main-scroll-area" class="flex-1 bg-batik relative block w-full">
        <div style="display: flex; min-height: 100%; min-width: 100%; width: max-content; padding: 2rem 1.5rem; align-items: center; justify-content: center; margin: 0 auto; perspective: 1000px">
          <div class="book-container w-full max-w-4xl p-2 md:p-3 relative flex flex-col h-[80vh] lg:h-[480px] flex-shrink-0" style="min-width: 680px">
            <div id="book-layout" class="book-content flex flex-row flex-1 overflow-hidden bg-[#FEFBF3]"></div>
          </div>
        </div>
      </main>
    </div>

    <div id="canvas-modal" class="fixed inset-0 z-[100] hidden overflow-y-auto bg-black/80 backdrop-blur-sm">
      <div style="display: flex; min-height: 100%; align-items: flex-start; justify-content: center; padding: 3rem 1rem">
        <div
          class="bg-[#FEFBF3] relative border-4 border-[#03A9F4] flex flex-col items-center shadow-3d-brown"
          style="margin: auto; padding: 2.5rem; border-radius: 1.5rem; width: 100%; max-width: 650px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8)"
        >
          <a
            href="/beranda.html"
            class="btn-home-popup absolute cursor-pointer"
            style="
              top: -20px;
              left: -20px;
              background-color: #03a9f4;
              color: #ffffff;
              width: 45px;
              height: 45px;
              display: flex;
              align-items: center;
              justify-content: center;
              border-radius: 50%;
              font-weight: 900;
              border: 2px solid #ffc947;
              z-index: 50;
              box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
              text-decoration: none;
              transition: all 0.3s ease;
            "
            title="Pulang ke Beranda"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </a>
          <button
            onclick="closeCanvas()"
            class="btn-close-3d cursor-pointer"
            style="
              position: absolute;
              top: -20px;
              right: -20px;
              background-color: #795548;
              color: #ffffff;
              width: 45px;
              height: 45px;
              display: flex;
              align-items: center;
              justify-content: center;
              border-radius: 50%;
              font-weight: 900;
              border: 2px solid #03a9f4;
              font-size: 20px;
              z-index: 50;
              box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            "
          >
            ✖
          </button>

          <div class="book-banner text-center z-10" style="padding: 0.5rem 2rem; border-radius: 0.75rem; margin-bottom: 2rem">
            <h2 class="font-serif font-bold tracking-wide" style="font-size: 1.25rem">Latihan Nebali Pasangan</h2>
          </div>

          <div id="canvas-container" style="display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2rem; width: 100%; margin-bottom: 2rem"></div>

          <div style="display: flex; flex-direction: row; justify-content: center; gap: 1.5rem; width: 100%">
            <button
              onclick="clearCanvas()"
              class="btn-modern-3d font-bold shadow-md cursor-pointer"
              style="flex: 1; padding: 0.875rem; border-radius: 0.75rem; font-size: 0.875rem; background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; border-bottom: 4px solid #7f1d1d; text-shadow: none"
            >
              ↺ BALENI
            </button>
            <button
              onclick="checkCanvas()"
              class="btn-modern-3d font-bold shadow-md cursor-pointer"
              style="flex: 1; padding: 0.875rem; border-radius: 0.75rem; font-size: 0.875rem; background: linear-gradient(135deg, #22c55e, #15803d); color: white; border-bottom: 4px solid #14532d; text-shadow: none"
            >
              ✅ CEK HASIL
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/pasangan/pasangan.js"></script>
  </body>
</html>
