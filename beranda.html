<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pasinaon Aksara Jawa</title>
    <style>
      .menu-card {
        background: linear-gradient(135deg, #03a9f4 0%, #0288d1 100%);
        border: 2px solid #01579b;
        border-radius: 6px;
        padding: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        color: white;
        font-weight: bold;
        text-align: center;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        font-size: 9px;
        line-height: 1.1;
      }

      .menu-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 14px rgba(0, 0, 0, 0.2);
        background: linear-gradient(135deg, #0288d1 0%, #0277bd 100%);
      }

      .menu-card:active {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      @media (min-width: 640px) {
        .menu-card {
          border: 2px solid #01579b;
          border-radius: 8px;
          padding: 10px;
          min-height: 48px;
          font-size: 11px;
        }
      }

      @media (min-width: 768px) {
        .menu-card {
          border: 3px solid #01579b;
          border-radius: 12px;
          padding: 14px;
          min-height: 56px;
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body class="bg-[#E1F5FE] font-sans overflow-hidden flex h-[100dvh]">
    <div class="flex-1 flex flex-col h-full w-full overflow-hidden">

      <main class="flex-1 p-2 sm:p-3 md:p-6 lg:p-10 bg-batik flex items-center justify-center overflow-hidden">
        <div class="flex flex-row gap-2 sm:gap-3 md:gap-6 lg:gap-8 w-full h-full max-w-7xl">

          <!-- Peta -->
          <div class="flex-1 flex items-center justify-center min-w-0">
            <div class="relative rounded-lg sm:rounded-xl md:rounded-3xl overflow-hidden shadow-2xl border-2 sm:border-3 md:border-4 border-white w-full h-auto cursor-default aspect-video">
              <img src="/assets/peta-candi-full.png" class="w-full h-full object-cover" alt="Peta Candi" />
            </div>
          </div>

          <!-- Menu Section -->
          <div class="flex-shrink-0 w-36 sm:w-44 md:w-56 flex flex-col h-full gap-1 sm:gap-2">
            <!-- Title -->
            <div class="text-center flex-shrink-0 pb-0 sm:pb-2">
              <h1 class="font-serif text-xs sm:text-base md:text-lg font-bold text-[#3E2723] leading-none mb-0.5">Pasinaon</h1>
              <p class="text-[9px] sm:text-sm text-[#01579B] font-medium leading-none">Aksara Jawa</p>
            </div>

            <!-- Menu Cards Scrollable -->
            <div class="flex-1 overflow-y-auto overflow-x-hidden flex flex-col gap-1 sm:gap-2">
              <a href="pengenalan.html" class="menu-card">
                <span>Pengenalan Aksara Jawa</span>
              </a>
              <a href="legena.html" class="menu-card">
                <span>Aksara Legena</span>
              </a>
              <a href="sandhangan.html" class="menu-card">
                <span>Sandhangan Swara</span>
              </a>
              <a href="peta.html" class="menu-card">
                <span>Latihan Pasinaon</span>
              </a>
            </div>
          </div>

        </div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
